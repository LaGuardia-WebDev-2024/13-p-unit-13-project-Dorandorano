<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 13 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1>Quiz About Goune</h1>
    <hr />
    <!-- Movie Question -->
    <form id="movie-form">
      <label>
        🎥 What is my favorite movie....
        <select id="movie-answer">
          <option value="movie1">Everything everywhere all at once</option>
          <option value="movie2">substance</option>
          <option value="movie3">train to busan</option>
          <option value="movie4">song of the sea</option>
          <option value="movie5">
            brokeback mountain
          </option>
        </select>
      </label>
      <button id="button1" type="submit">Check Movie Answer</button>
    </form>
    <div id="movie-result">
    <img id="ham" src="https://media4.giphy.com/media/yaUG0KDAcIcWA/200w.gif?cid=6c09b9521lzl2bkdjj90rjmy0bmq2joh17xxvxke530th65k&ep=v1_gifs_search&rid=200w.gif&ct=g"/>
    
    <img id="silly" src="https://media.tenor.com/n-dQKqmfffcAAAAM/hamster-cute.gif">
    </div>
    <hr />
    <!-- Book Question -->
    <form id="book-form">
      <label>
        📖 What is my favorite book?
        <select id="book-answer">
          <option value="book1">attack on titian</option>
          <option value="book2">the bible</option>
          <option value="book3">where thye wild tings aree</option>
          <option value="book4">im glad my mom died</option>
        </select>
      </label>
      <button id="button2" type="submit">Check Book Answer</button>
    </form>
    <div id="book-result">
    <img id="blah" src="https://38.media.tumblr.com/94b15d764d1e6ceb8a06f7fdc89a4874/tumblr_nx3n7j9D1l1rluhlpo1_400.gif">
    
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      //Movie Question jQuery Code
      $("#movie-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#movie-answer");
        var answer = $answer.val();

        if (answer === "movie4") {
          $("#movie-result").text("YESSSS!");
          $("#movie-result").attr('src','https://previews.123rf.com/images/stocking/stocking1410/stocking141000165/32258773-portrait-of-a-very-happy-man.jpg');

        } else {
          $("#movie-result").text("Try Again!");
          
        }
      });
      
      $("#button1").click(function(){
  $("#movie-result").slideUp();
});

      //Book Question jQuery Code
      $("#book-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#book-answer");
        var answer = $answer.val();

        if (answer === "book1") {
          $("#book-result").text("YESSSS!");
        } else {
          $("#book-result").text("Try Again!");
        }
      });
     
      $("#button2").click(function(){
  $("#book-result").slideUp();
});
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
